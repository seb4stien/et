[project]
name = "et"
version = "1.0.0"
description = "et: a small CLI to track effort and manage your Ubuntu/GNOME workspace."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Sebastien Georget", email = "sebastien.georget@canonical.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "typer>=0.12",
]

[project.scripts]
et = "et.cli:app"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "prek>=0.3",
    "types-pyyaml>=6.0.12.20260518",
    "types-requests>=2.33.0.20260712",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=et --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["et"]
branch = true

[tool.coverage.report]
show_missing = true
